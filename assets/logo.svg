<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="50%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="scarletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D3D"/>
      <stop offset="100%" stop-color="#E8271A"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8271A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8271A" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Cyber Cut -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Cyber Tech Corner Brackets -->
  <path d="M 40 100 L 40 40 L 100 40" fill="none" stroke="#E8271A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 472 100 L 472 40 L 412 40" fill="none" stroke="#E8271A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 40 412 L 40 472 L 100 472" fill="none" stroke="#E8271A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 472 412 L 472 472 L 412 472" fill="none" stroke="#E8271A" stroke-width="6" stroke-linecap="round"/>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="256,60 430,160 430,360 256,460 82,360 82,160" fill="rgba(232, 39, 26, 0.05)" stroke="#E8271A" stroke-width="5" stroke-opacity="0.5" filter="url(#glow)"/>
  <polygon points="256,76 414,168 414,348 256,440 98,348 98,168" fill="#07070b" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Geometric Decorative Data Grid / Accent Lines -->
  <line x1="140" y1="256" x2="160" y2="256" stroke="#E8271A" stroke-width="3" stroke-linecap="round"/>
  <line x1="352" y1="256" x2="372" y2="256" stroke="#E8271A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="115" r="4" fill="#E8271A" filter="url(#glow)"/>

  <!-- JGR Bold Monogram Typography -->
  <text x="256" y="295" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="138" font-weight="900" letter-spacing="-0.03em" text-anchor="middle" fill="#FFFFFF">
    JG<tspan fill="url(#scarletGrad)">R</tspan>
  </text>

  <!-- Technical Status Label -->
  <text x="256" y="375" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="800" letter-spacing="0.34em" text-anchor="middle" fill="#9CA3AF">
    SECURITY
  </text>

  <!-- Sub-Accent Terminal Line -->
  <rect x="196" y="405" width="120" height="3" rx="1.5" fill="#E8271A" filter="url(#glow)"/>
</svg>